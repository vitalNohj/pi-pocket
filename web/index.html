<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#13141c" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Pi Pocket</title>
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
            The last look this browser used (theme.js keeps it), before the first paint: no flash of another theme. Its
            fonts (JetBrains Mono, the default, before it chose one) start loading at once. Above the style sheet: a
            script after one waits for it.
        -->
        <script>
            var fonts = ["/fonts/JetBrainsMono.woff2"];
            try {
                var look = JSON.parse(localStorage.getItem("pocket.themeCache") || "null");
                if (look) {
                    if (Array.isArray(look.fonts)) fonts = look.fonts;
                    var root = document.documentElement;
                    for (var name in look.vars) root.style.setProperty(name, look.vars[name]);
                    for (var key in look.attrs) root.dataset[key] = look.attrs[key];
                    document
                        .querySelector('meta[name="theme-color"]')
                        .setAttribute("content", look.vars["--o-bg"]);
                }
            } catch (error) {}
            for (var i = 0; i < fonts.length; i++) {
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "font";
                link.type = "font/woff2";
                link.crossOrigin = "anonymous";
                link.href = fonts[i];
                document.head.appendChild(link);
            }
        </script>
        <link rel="stylesheet" href="/style.css" />
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs",
                    "marked": "/vendor/marked.mjs",
                    "dompurify": "/vendor/purify.mjs"
                }
            }
        </script>
    </head>
    <body>
        <!-- The same boot screen the app shows while it starts (Boot in ui.js), so nothing jumps when the script takes over. -->
        <div id="app">
            <div class="boot" role="status">
                <div class="boot-mark" aria-hidden="true">π</div>
                <div class="boot-bar" aria-hidden="true"><span></span></div>
                <div class="boot-caption">starting</div>
            </div>
        </div>
        <script type="module" src="/app.js"></script>
    </body>
</html>
