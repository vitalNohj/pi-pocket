<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>V4 · Folder map</title>
        <script>
            window.onerror = function (m) {
                var b =
                    document.getElementById("err") ||
                    document.body.appendChild(
                        Object.assign(document.createElement("div"), {
                            id: "err",
                            className: "err",
                        }),
                    );
                b.textContent = "Something went wrong: " + m;
            };
        </script>
        <link rel="stylesheet" href="common.css" />
        <style>
            #map {
                padding: 10px 10px 150px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .zone {
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--panel);
                overflow: hidden;
            }
            .zone > .zh {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 9px 12px 7px;
                border-bottom: 1px solid var(--line2);
            }
            .zone > .zh b {
                font-size: 13.5px;
            }
            .zone > .zh code {
                font-size: 11px;
            }
            .zone > .zh small {
                margin-left: auto;
                color: var(--muted);
                font-size: 11.5px;
                white-space: nowrap;
            }
            .cells {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 6px;
                padding: 8px;
            }
            .cell {
                border: 1px solid var(--line2);
                border-left: 4px solid var(--c);
                border-radius: 8px;
                background: var(--panel2);
                padding: 7px 8px 8px;
                cursor: pointer;
                min-height: 66px;
                display: flex;
                flex-direction: column;
                gap: 3px;
                position: relative;
            }
            .cell:active {
                transform: scale(0.98);
            }
            .cell .p {
                font-family: var(--mono);
                font-size: 10.5px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .cell .b {
                font-size: 12.5px;
                font-weight: 600;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .cell .r {
                font-size: 10px;
                color: var(--faint);
            }
            .cell .pips {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
                margin-top: auto;
            }
            .pip {
                width: 15px;
                height: 15px;
                border-radius: 50%;
                border: 2px solid;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 6px;
                font-weight: 800;
                color: #0d1117;
            }
            .cell.idle {
                opacity: 0.5;
            }
            .cell.idle .b {
                font-weight: 500;
            }
            .cell.clash {
                box-shadow: inset 0 0 0 1.5px #f85149;
            }
            .cell.dirty::after {
                content: "";
                position: absolute;
                top: 7px;
                right: 7px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #d29922;
            }
            .cell.gone {
                border-style: dashed;
            }
            .cell.main {
                border-left-width: 7px;
                background: linear-gradient(90deg, #3fb95016, var(--panel2));
            }
            .cell.dim {
                opacity: 0.12;
            }
            .cell.hit {
                outline: 2px solid var(--sel);
                outline-offset: 1px;
            }
            .more {
                grid-column: 1/-1;
                font-size: 12px;
                color: var(--accent);
                background: none;
                border: 1px dashed var(--line);
                border-radius: 8px;
                padding: 8px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="loading" id="loading">Loading the map…</div>
        <script src="common.js"></script>
        <script>
            WT.guard(() => {
                const { repos, wts, sessions, esc, h, home, ago } = WT;
                document.getElementById("loading").remove();
                const head = WT.toolbar({
                    about: "Folders grouped by where they sit on this machine, not by repo. The coloured edge is the repo; the dots are the sessions that worked there, filled when they changed files. Good for cleanup: faded folders had no session in 14 days.",
                    legend: `<span><span class="sw" style="background:#58a6ff;width:5px;height:14px"></span>repo</span><span><span class="dot" style="background:#d29922"></span>uncommitted</span><span><span class="ring" style="color:#f85149"></span>2+ sessions changed it</span><span style="opacity:.55">faded = idle 14 days</span>`,
                });
                const map = h(`<div id="map"></div>`);
                document.body.append(head.el, map);

                const ZONES = [
                    [
                        "main",
                        "Main copies",
                        "The real clones each repo works from. Your live Pi Pocket copy is here.",
                    ],
                    [
                        "treehouse",
                        "Fleet worker slots",
                        "~/.treehouse: reusable numbered slots Firstmate leases to each worker.",
                    ],
                    [
                        "sibling",
                        "Hand-made, next to the main copy",
                        "Folders like ~/pi-pocket-* made by your own chats.",
                    ],
                    [
                        "pocket",
                        "Made by Pi Pocket",
                        "~/.pi-pocket/worktrees: Pocket made these for a session.",
                    ],
                    ["tmp", "Temporary", "/tmp: wiped on reboot, so anything here is at risk."],
                    ["cache", "Cache", "~/.cache: tool-made scratch copies."],
                    ["data", "Firstmate scratch", "Copies inside Firstmate's own data folder."],
                    ["other", "Elsewhere", ""],
                ];
                let mode = "all",
                    sel = null,
                    open = {};
                WT.setOnSelect((x) => {
                    const next = x ? x.s || sel : null;
                    if (next !== sel) {
                        sel = next;
                        render();
                    }
                });
                head.ctl.appendChild(
                    WT.segmented(
                        [
                            ["all", "All"],
                            ["active", "Touched"],
                            ["cleanup", "Cleanup"],
                        ],
                        mode,
                        (k) => {
                            mode = k;
                            render();
                        },
                    ),
                );
                const cleanup = (w) =>
                    !w.isMain && (!w.sessions.length || !w.exists || w.prunable) && !w.task;
                function render() {
                    map.innerHTML = "";
                    for (const [k, title, desc] of ZONES) {
                        let list = wts.filter((w) => w.loc === k);
                        if (mode === "active") list = list.filter((w) => w.sessions.length);
                        if (mode === "cleanup") list = list.filter(cleanup);
                        if (!list.length) continue;
                        list.sort(
                            (a, b) =>
                                (b.last ?? -1e9) - (a.last ?? -1e9) ||
                                a.repo.idx - b.repo.idx ||
                                a.name.localeCompare(b.name),
                        );
                        const touched = list.filter((w) => w.sessions.length).length,
                            dirty = list.filter((w) => w.dirty).length;
                        const z = h(
                            `<section class="zone"><div class="zh"${desc ? ` title="${esc(desc)}"` : ""}><b>${esc(title)}</b><small>${list.length} · ${touched} touched${dirty ? ` · <span style="color:#e3b341">${dirty} uncommitted</span>` : ""}</small></div><div class="cells"></div></section>`,
                        );
                        const cells = z.querySelector(".cells");
                        const LIMIT = open[k] ? 1e9 : mode === "all" ? 18 : 60;
                        list.slice(0, LIMIT).forEach((w) => {
                            const hit = sel && w.sessions.some((L) => L.s === sel);
                            const c =
                                h(`<div class="cell${w.isMain ? " main" : ""}${w.sessions.length ? "" : " idle"}${w.writers > 1 ? " clash" : ""}${w.dirty ? " dirty" : ""}${w.exists ? "" : " gone"}${sel && !hit ? " dim" : ""}${hit ? " hit" : ""}" style="--c:${w.repo.color};--sel:${sel ? sel.color : "transparent"}">
        <div class="r">${esc(w.repo.label)}</div>
        <div class="b">${esc(w.isMain ? w.name : w.short)}</div>
        <div class="p">${esc(home(w.id))}</div>
        <div class="r">${w.isMain ? "main" : `+${w.ahead} / −${w.behind}`} · ${w.last != null ? ago(w.last) : "idle"}</div>
        <div class="pips">${w.sessions
            .slice(0, 9)
            .map(
                (L) =>
                    `<span class="pip" title="${esc(L.s.title)}" style="border-color:${L.s.color};background:${L.w_ ? L.s.color : "transparent"}"></span>`,
            )
            .join(
                "",
            )}${w.sessions.length > 9 ? `<span class="r">+${w.sessions.length - 9}</span>` : ""}</div></div>`);
                            c.onclick = () => WT.showWt(w);
                            cells.appendChild(c);
                        });
                        if (list.length > LIMIT) {
                            const m = h(
                                `<button class="more">Show ${list.length - LIMIT} more in ${esc(title.toLowerCase())}</button>`,
                            );
                            m.onclick = () => {
                                open[k] = true;
                                render();
                            };
                            cells.appendChild(m);
                        }
                        map.appendChild(z);
                    }
                    if (!map.children.length)
                        map.appendChild(h(`<div class="loading">Nothing matches.</div>`));
                }
                render();
            });
        </script>
    </body>
</html>
