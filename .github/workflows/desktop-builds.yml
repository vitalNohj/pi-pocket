# Builds unsigned installers from the branch's source. Publishes workflow artifacts only.
name: Desktop builds

on:
    push:
        branches: [desktop-native]
    pull_request:
        branches: [desktop-native]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    contract:
        name: Desktop contract (Linux)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - run: node --test --test-concurrency=2 test/desktop/*.test.mjs

    update-feed:
        name: Desktop update feed tests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - run: node --test --test-concurrency=2 test/desktop/updates.test.mjs

    runner-controller:
        name: Runner controller (Linux)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - run: node --test test/desktop/runner.test.mjs

    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      name: Windows installer
                      basename: Pi-Pocket-Setup
                      extension: exe
                      publish: true
                    - os: macos-latest
                      name: macOS package
                      basename: Pi-Pocket
                      extension: pkg
                      publish: true
                    - os: macos-15-intel
                      name: macOS package (Intel)
                      # Both Mac jobs build a universal package. Publish only one copy in the feed.
                      publish: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Stage the branch's source to pack
              id: source
              shell: bash
              run: |
                  source="$RUNNER_TEMP/desktop-source"
                  if [ "$RUNNER_OS" = Windows ]; then
                      # Git Bash's tar needs forward slashes; keep the drive letter for Node and npm.
                      source="$(cygpath -m "$source")"
                  fi
                  mkdir -p "$source"
                  git archive HEAD | tar -x -C "$source"

                  base="$(node -p 'require("./package.json").version.split("-")[0]')"
                  version="$base-desktop.$GITHUB_RUN_NUMBER"
                  npm --prefix "$source" version "$version" --no-git-tag-version --ignore-scripts --workspaces=false

                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
                  printf 'next=%s-desktop.%s\n' "$base" "$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

            - name: Build the unsigned Windows installer
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  VERSION: ${{ steps.source.outputs.version }}
              run: |
                  ./packaging/windows/build.ps1 -Version $env:VERSION -OutDir (Join-Path $env:RUNNER_TEMP "desktop-output") `
                      -Source (Join-Path $env:RUNNER_TEMP "desktop-source") -WithDesktopUpdate

            - name: Build the unsigned macOS package
              if: runner.os == 'macOS'
              env:
                  VERSION: ${{ steps.source.outputs.version }}
              run: packaging/macos/build.sh "$VERSION" "$RUNNER_TEMP/desktop-output" --source "$RUNNER_TEMP/desktop-source" --with-desktop-update

            - name: Install N and build the N+1 fixture (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  VERSION: ${{ steps.source.outputs.version }}
                  NEXT: ${{ steps.source.outputs.next }}
              run: |
                  $setup = Join-Path $env:RUNNER_TEMP "desktop-output/Pi-Pocket-Setup-$env:VERSION.exe"
                  $log = Join-Path $env:RUNNER_TEMP "desktop-setup.log"
                  $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                      '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup', "/LOG=`"$log`""
                  )
                  if ($install.ExitCode -ne 0) { Get-Content $log; throw "Setup exited with $($install.ExitCode)" }
                  ./packaging/windows/build.ps1 -Version $env:NEXT -OutDir (Join-Path $env:RUNNER_TEMP "desktop-update-next") -DesktopOnly

            - name: Install N and build the N+1 fixture (macOS)
              if: runner.os == 'macOS'
              env:
                  VERSION: ${{ steps.source.outputs.version }}
                  NEXT: ${{ steps.source.outputs.next }}
              run: |
                  installer -pkg "$RUNNER_TEMP/desktop-output/Pi-Pocket-$VERSION.pkg" -target CurrentUserHomeDirectory
                  "$HOME/Library/Application Support/Pi Pocket/login-item.sh" on
                  packaging/macos/build.sh "$NEXT" "$RUNNER_TEMP/desktop-update-next" --desktop-only

            - name: Build the update input driver (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
                  & $csc /nologo /r:System.Drawing.dll /r:System.Windows.Forms.dll `
                      "/out:$env:RUNNER_TEMP/desktop-input.exe" test/desktop/WindowInput.cs
                  if ($LASTEXITCODE -ne 0) { throw "Desktop input driver did not compile" }

            - name: Build the update input driver (macOS)
              if: runner.os == 'macOS'
              run: swiftc test/desktop/window-input.swift -o "$RUNNER_TEMP/desktop-input"

            - name: Check, verify and stage N+1 in Settings, then apply it on next start
              shell: bash
              env:
                  VERSION: ${{ steps.source.outputs.version }}
                  NEXT: ${{ steps.source.outputs.next }}
              run: |
                  driver="$RUNNER_TEMP/desktop-input"
                  if [ "$RUNNER_OS" = Windows ]; then driver="$driver.exe"; fi
                  node test/desktop/updates-smoke.mjs "$VERSION" "$NEXT" "$driver"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: desktop-update-proof-${{ runner.os }}-${{ runner.arch }}
                  path: ${{ runner.temp }}/desktop-update-proof
                  retention-days: 7

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: matrix.publish
              with:
                  name: ${{ matrix.basename }}-${{ steps.source.outputs.version }}
                  path: ${{ runner.temp }}/desktop-output/${{ matrix.basename }}-${{ steps.source.outputs.version }}.${{ matrix.extension }}
                  if-no-files-found: error
                  retention-days: 14

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: matrix.publish
              with:
                  # GitHub serves this single file as-is, so the updater can check the artifact digest itself.
                  path: ${{ runner.temp }}/desktop-output/Pi-Pocket-Desktop-Update-${{ steps.source.outputs.version }}.${{ matrix.extension }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14
